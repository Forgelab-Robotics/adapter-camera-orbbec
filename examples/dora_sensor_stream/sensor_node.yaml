device_index: 0
align_mode: sw
capture_process: isolated
frame_sync: true
point_cloud:
  enabled: true
  colorize: true
  frame_id: null
color:
  data_flow:
    width: 640
    height: 480
    fps: 30
    format: rgb8
depth:
  data_flow:
    enabled: true
    width: 640
    height: 400
    fps: 30
    format: y16
  advanced:
    min_mm: 100
    max_mm: 10000
ir:
  data_flow:
    enabled: true
    width: 640
    height: 400
    fps: 30
    format: ir8
output_color: image/color
output_depth: image/depth
output_ir: image/ir
output_point_cloud: point_cloud
