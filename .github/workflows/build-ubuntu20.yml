name: Build Ubuntu 20.04 binary

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v1.1.0
      version:
        description: Orbbec camera version without the v prefix
        required: true
        default: 1.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Install system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git \
            libusb-1.0-0
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv and Python 3.12
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh |
            env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12
          uv --version
          uv run --no-project --python 3.12 python --version

      - name: Build with PyInstaller
        run: ./scripts/build_pyinstaller.sh

      - name: Verify and package binary
        run: |
          test "${{ inputs.ref }}" = "v${RELEASE_VERSION}"
          ./dist/orbbec_camera --version | tee /tmp/version.txt
          grep -q "${RELEASE_VERSION}" /tmp/version.txt
          file ./dist/orbbec_camera
          ldd --version | sed -n '1p'
          archive="orbbec_camera-v${RELEASE_VERSION}-ubuntu20.04-x86_64.tar.gz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "${archive}" \
            orbbec_camera
          sha256sum "${archive}" > "${archive}.sha256"
          test "$(tar -tzf "${archive}")" = "orbbec_camera"
          sha256sum --check "${archive}.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64
          path: |
            orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz
            orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
